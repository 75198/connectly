# Copy to .github/workflows/ci.yml to enable (pushing workflow files needs the GitHub "workflow" token scope).
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: connectly
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: connectly_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U connectly" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://connectly:ci-only-password@localhost:5432/connectly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p web
      - run: npm run build
      - run: npm test
